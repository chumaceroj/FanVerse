{% extends 'blogs/base.html' %}
{% block content %}

<div class="blog-card">
    <h1 style="color: midnightblue; margin: 0 0 24px 0;">Create a New Post</h1>

    {% if messages %}
        <div style="margin-bottom: 20px;">
            {% for message in messages %}
                <div style="color: crimson; font-weight: bold; margin-bottom: 12px;">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label style="font-weight: bold; color: midnightblue;">Title:</label><br>
        <input type="text" name="title" value="{{ title|default:'' }}" required
            style="padding: 8px; border-radius: 4px; border: 1px solid midnightblue; width: 100%; margin-top: 4px; margin-bottom: 16px;"><br>

        <label style="font-weight: bold; color: midnightblue;">Content:</label><br>
        <textarea name="content" rows="10" required
            style="width: 100%; border-radius: 8px; border: 1px solid midnightblue; padding: 8px; margin-top: 4px; margin-bottom: 16px;">{{ content|default:'' }}</textarea><br>

        <label style="font-weight: bold; color: midnightblue;">Invite Collaborators (optional):</label><br>
        <p style="margin: 4px 0 8px 0; color: grey; font-size: 14px;">Enter usernames separated by commas (e.g. alice, bob)</p>
        <input type="text" name="collaborator_usernames" value="{{ collaborator_usernames|default:'' }}"
            style="padding: 8px; border-radius: 4px; border: 1px solid midnightblue; width: 100%; margin-bottom: 24px;"><br>

        <button type="submit" class="button">Publish Post</button>
    </form>
</div>

{% endblock %}
